<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>

<body class="bg-light">
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-6">
				<div class="card shadow">
					<div class="card-header bg-primary text-white">
						<h3>Update Employee</h3>
					</div>
					<div class="card-body">
						<form th:action="@{/update}" th:object="${employee}" method="post">
							<input type="hidden" th:field="*{id}">
							<div class="mb-3">
								<label>Name</label> <input type="text" th:field="*{name}"
									class="form-control">
							</div>
							<div class="mb-3">
								<label>Department</label> <input type="text"
									th:field="*{department}" class="form-control">
							</div>
							<div class="mb-3">
								<label>Salary</label> <input type="number" th:field="*{salary}"
									class="form-control">
							</div>
							<button class="btn btn-success w-100">Update Employee</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
