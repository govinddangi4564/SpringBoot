<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">

	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-6">

				<div class="card shadow-sm">
					<div class="card-header bg-primary text-white">
						<h4 class="mb-0">Employee Details</h4>
					</div>

					<div class="card-body">
						<form th:object="${employee}" action="add" method="post">

							<div class="mb-3">
								<label for="name" class="form-label fw-bold">Name</label> <input
									type="text" th:field="*{name}" class="form-control"
									placeholder="Enter employee name" required>
							</div>

							<div class="mb-3">
								<label for="department" class="form-label fw-bold">Department</label>
								<input type="text" th:field="*{department}" class="form-control"
									placeholder="e.g. IT, HR, Finance" required>
							</div>

							<div class="mb-4">
								<label for="salary" class="form-label fw-bold">Salary</label> <input
									type="text" th:field="*{salary}" class="form-control"
									placeholder="Enter salary amount" required>
							</div>

							<div class="d-grid">
								<button type="submit" class="btn btn-success btn-lg">Submit</button>
							</div>

						</form>
					</div>
				</div>

			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
